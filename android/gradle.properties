android.useAndroidX=true
android.enableJetifier=true

# 提升编译速度配置 https://blog.csdn.net/weixin_33943347/article/details/91361727
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# 开启gradle缓存
org.gradle.caching=true

# 关闭 Built-in Kotlin（Flutter 3.44.0 默认即为 false）：
# builtInKotlin=true 会强制使用 Flutter 内置 Kotlin 2.0.0 编译所有模块，
# 而 flutter_tts/mobile_scanner 插件依赖 kotlin-stdlib 2.2.20（元数据 2.2.0），
# 2.0.0 编译器最多只能读取 2.1.0，导致打包报错。
# 改为 false 后由 settings.gradle 统一声明 KGP 2.2.20 编译。
android.builtInKotlin=false
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# 跨盘符 JDK 路径
org.gradle.java.home=E:\\.jdk\\jdk-17.0.19+10
# 禁用Kotlin增量编译（跨盘符项目避免路径异常）
kotlin.incremental=false
